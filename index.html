<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#061912">
    <title>Kodavalam - Village Exploration Simulator</title>
    <meta name="description" content="An immersive 3D village exploration simulation of the heritage riverside settlement of Kodavalam. Discover folklore, meet villagers, craft clay pottery, brew chai, ring the temple bell, and explore lush groves.">
    <meta property="og:title" content="Kodavalam - Village Exploration Simulator">
    <meta property="og:description" content="An immersive 3D village exploration simulation of the heritage riverside settlement of Kodavalam. Discover folklore, meet villagers, craft clay pottery, brew chai, ring the temple bell, and explore lush groves.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { 
          width: 100%;
          height: 100%;
          height: 100dvh;
          margin: 0;
          padding: 0;
          overflow: hidden; 
          background-color: #061912;
          font-family: 'Plus Jakarta Sans', sans-serif;
          touch-action: manipulation;
        }
        #root {
          width: 100%;
          height: 100%;
          height: 100dvh;
          margin: 0;
          padding: 0;
          position: fixed;
          inset: 0;
          overflow: hidden;
        }
        .font-serif-title {
          font-family: 'Cinzel', serif;
        }
        input, textarea, select {
          user-select: text !important;
          -webkit-user-select: text !important;
          -webkit-touch-callout: default !important;
          touch-action: manipulation !important;
          font-size: 16px !important;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
          width: 6px;
          height: 6px;
        }
        ::-webkit-scrollbar-track {
          background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.2);
          border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: rgba(255, 255, 255, 0.4);
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="text-stone-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
